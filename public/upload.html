<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Guide – SHSID Peer Advisors</title>
  <link rel="icon" type="image/png" href="/icon.png" />
  <script>
    // Apply saved theme before paint to avoid flash
    (function(){ var t=localStorage.getItem('pa-theme'); if(t==='light') document.documentElement.setAttribute('data-theme','light'); })();
  </script>
  <style>
    /* ── Theme variables ── */
    :root {
      --nav-bg: #9b3060;
      --nav-text: #fff;
      --nav-link: #fce4ec;
      --nav-link-hover: #fff;
      --body-bg: #fff8fb;
      --text-primary: #2d1020;
      --text-secondary: #7a4560;
      --accent: #c2185b;
      --card-bg: #ffffff;
      --card-shadow: rgba(194,24,91,0.09);
      --input-border: #e0b0c8;
      --input-focus: #c2185b;
      --input-bg: #fff;
      --file-border: #e0b0c8;
      --file-hover-bg: #fff0f5;
      --file-hover-border: #c2185b;
      --submit-bg: #c2185b;
      --submit-text: #fff;
      --back-link: #c2185b;
      --footer-border: #f0c8d8;
      --footer-text: #b07090;
      --toggle-bg: rgba(255,255,255,0.18);
      --toggle-text: #fff;
      --toggle-border: rgba(255,255,255,0.35);
    }
    [data-theme="light"] {
      --nav-bg: #1a1a2e;
      --nav-text: #fff;
      --nav-link: #cdd3f0;
      --nav-link-hover: #fff;
      --body-bg: #f8f9fc;
      --text-primary: #1a1a2e;
      --text-secondary: #555;
      --accent: #e94560;
      --card-bg: #ffffff;
      --card-shadow: rgba(0,0,0,0.08);
      --input-border: #ccc;
      --input-focus: #e94560;
      --input-bg: #fff;
      --file-border: #ccc;
      --file-hover-bg: #fff5f7;
      --file-hover-border: #e94560;
      --submit-bg: #e94560;
      --submit-text: #fff;
      --back-link: #e94560;
      --footer-border: #e0e0e0;
      --footer-text: #888;
      --toggle-bg: rgba(255,255,255,0.12);
      --toggle-text: #cdd3f0;
      --toggle-border: rgba(255,255,255,0.25);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--text-primary);
      background: var(--body-bg);
      line-height: 1.6;
      transition: background 0.3s, color 0.3s;
    }

    /* ── NAV ── */
    nav {
      background: var(--nav-bg);
      color: var(--nav-text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      height: 62px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
    }
    .nav-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .nav-brand {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--nav-text);
      text-decoration: none;
      white-space: nowrap;
    }
    .nav-right { display: flex; align-items: center; gap: 0.5rem; }
    nav a { color: var(--nav-link); text-decoration: none; font-size: 0.92rem; padding: 0.35rem 0.7rem; border-radius: 6px; transition: color 0.2s, background 0.2s; }
    nav a:hover { color: var(--nav-link-hover); background: rgba(255,255,255,0.1); }

    /* Theme toggle */
    .theme-toggle {
      background: var(--toggle-bg);
      color: var(--toggle-text);
      border: 1px solid var(--toggle-border);
      border-radius: 20px;
      padding: 0.3rem 0.8rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: background 0.2s, opacity 0.2s;
      white-space: nowrap;
    }
    .theme-toggle:hover { opacity: 0.85; }
    .toggle-icon { font-size: 0.95rem; }

    main {
      max-width: 560px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }

    h1 { font-size: 1.9rem; font-weight: 800; margin-bottom: 0.25rem; color: var(--text-primary); }
    .subtitle { color: var(--text-secondary); margin-bottom: 2rem; }

    .form-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 2rem;
      box-shadow: 0 2px 16px var(--card-shadow);
    }

    .form-group { margin-bottom: 1.25rem; }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.3rem;
    }
    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--input-border);
      border-radius: 7px;
      font-size: 0.95rem;
      background: var(--input-bg);
      color: var(--text-primary);
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      outline: 2px solid var(--input-focus);
      border-color: transparent;
    }

    .file-input-wrap {
      border: 2px dashed var(--file-border);
      border-radius: 9px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .file-input-wrap:hover, .file-input-wrap.drag-over {
      border-color: var(--file-hover-border);
      background: var(--file-hover-bg);
    }
    .file-input-wrap input[type="file"] {
      display: none;
    }
    .file-label-text { font-size: 0.9rem; color: var(--text-secondary); }
    .file-label-text strong { color: var(--accent); }
    #file-name { font-size: 0.82rem; color: var(--text-secondary); margin-top: 0.4rem; }

    .error-msg {
      color: #c0392b;
      background: #fdf0f0;
      border: 1px solid #f5c6cb;
      border-radius: 7px;
      padding: 0.6rem 0.9rem;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: none;
    }
    .success-msg {
      color: #155724;
      background: #d4edda;
      border: 1px solid #c3e6cb;
      border-radius: 7px;
      padding: 0.6rem 0.9rem;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: none;
    }

    .submit-btn {
      width: 100%;
      padding: 0.8rem;
      background: var(--submit-bg);
      color: var(--submit-text);
      border: none;
      border-radius: 7px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .submit-btn:hover { opacity: 0.88; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .back-link { display: inline-block; margin-top: 1.25rem; color: var(--back-link); text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { text-decoration: underline; }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.85rem;
      color: var(--footer-text);
      border-top: 1px solid var(--footer-border);
      margin-top: 4rem;
    }

    /* ── Mobile ── */
    @media (max-width: 540px) {
      nav { padding: 0 1rem; }
      .nav-brand { font-size: 1rem; }
      .theme-toggle .toggle-label { display: none; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-left" href="index.html">
    <img class="nav-icon" src="/icon.png" alt="SHSID PA icon" />
    <span class="nav-brand">SHSID Peer Advisors</span>
  </a>
  <div class="nav-right">
    <a href="guides.html">← Back to Guides</a>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
      <span class="toggle-icon">🌸</span><span class="toggle-label">Pink</span>
    </button>
  </div>
</nav>

<main>
  <h1>Upload Guide</h1>
  <p class="subtitle">Share a new academic guide with the community.</p>

  <div class="form-card">
    <div class="error-msg" id="error-msg"></div>
    <div class="success-msg" id="success-msg"></div>

    <form id="upload-form" novalidate>
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="e.g. Introduction to Calculus" required />
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="e.g. Mathematics" required />
      </div>

      <div class="form-group">
        <label for="subject_level">Level</label>
        <select id="subject_level" name="subject_level" required>
          <option value="" disabled selected>Select a level</option>
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>
      </div>

      <div class="form-group">
        <label for="issue_number">Issue Number</label>
        <input type="number" id="issue_number" name="issue_number" min="1" placeholder="1" required />
      </div>

      <div class="form-group">
        <label>PDF File</label>
        <div class="file-input-wrap" id="file-drop-zone">
          <input type="file" id="pdf" name="pdf" accept=".pdf" required />
          <div class="file-label-text">
            <strong>Click to choose</strong> or drag &amp; drop a PDF
          </div>
          <div id="file-name">No file selected</div>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">Upload Guide</button>
    </form>
  </div>

  <a href="guides.html" class="back-link">← Back to all guides</a>
</main>

<footer>
  &copy; 2024 SHSID Peer Advisors &middot; All rights reserved
</footer>

<script>
  /* ---- Auth guard ---- */
  function parseJwt(token) {
    try {
      const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(atob(base64));
    } catch { return null; }
  }

  function isTokenValid(token) {
    if (!token) return false;
    const payload = parseJwt(token);
    if (!payload || !payload.exp) return false;
    return payload.exp * 1000 > Date.now();
  }

  const token = localStorage.getItem('jwt');
  if (!isTokenValid(token)) {
    window.location.href = 'guides.html';
  }

  /* ---- File input UX ---- */
  const pdfInput = document.getElementById('pdf');
  const fileNameEl = document.getElementById('file-name');
  const dropZone = document.getElementById('file-drop-zone');

  dropZone.addEventListener('click', () => pdfInput.click());
  pdfInput.addEventListener('change', () => {
    fileNameEl.textContent = pdfInput.files[0] ? pdfInput.files[0].name : 'No file selected';
  });

  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type === 'application/pdf') {
      const dt = new DataTransfer();
      dt.items.add(file);
      pdfInput.files = dt.files;
      fileNameEl.textContent = file.name;
    } else {
      showError('Only PDF files are accepted.');
    }
  });

  /* ---- Form submission ---- */
  const form = document.getElementById('upload-form');
  const errorEl = document.getElementById('error-msg');
  const successEl = document.getElementById('success-msg');
  const submitBtn = document.getElementById('submit-btn');

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = '';
    successEl.style.display = 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    const title = document.getElementById('title').value.trim();
    const subject = document.getElementById('subject').value.trim();
    const subject_level = document.getElementById('subject_level').value;
    const issue_number = document.getElementById('issue_number').value;
    const file = pdfInput.files[0];

    if (!title || !subject || !subject_level || !issue_number || !file) {
      showError('All fields are required.');
      return;
    }

    // Re-check token validity before submitting
    const jwt = localStorage.getItem('jwt');
    if (!isTokenValid(jwt)) {
      showError('Your session has expired. Please log in again.');
      setTimeout(() => { window.location.href = 'guides.html'; }, 2000);
      return;
    }

    const fd = new FormData();
    fd.append('title', title);
    fd.append('subject', subject);
    fd.append('subject_level', subject_level);
    fd.append('issue_number', issue_number);
    fd.append('pdf', file);

    submitBtn.disabled = true;
    submitBtn.textContent = 'Uploading…';

    try {
      const res = await fetch('/api/guides/upload', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${jwt}` },
        body: fd,
      });
      const data = await res.json();

      if (!res.ok) {
        showError(data.error || 'Upload failed.');
      } else {
        successEl.textContent = `"${data.title}" uploaded successfully!`;
        successEl.style.display = '';
        form.reset();
        fileNameEl.textContent = 'No file selected';
      }
    } catch {
      showError('Network error. Please try again.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Upload Guide';
    }
  });

  /* ── Theme persistence ── */
  const toggleBtn = document.getElementById('theme-toggle');

  function syncToggle() {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    toggleBtn.innerHTML = isLight
      ? '<span class="toggle-icon">☀️</span><span class="toggle-label">Light</span>'
      : '<span class="toggle-icon">🌸</span><span class="toggle-label">Pink</span>';
  }

  syncToggle();

  toggleBtn.addEventListener('click', () => {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    if (isLight) {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('pa-theme', 'pink');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      localStorage.setItem('pa-theme', 'light');
    }
    syncToggle();
  });
</script>
</body>
</html>
