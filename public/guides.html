<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guides – SHSID Peer Advisors</title>
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script>(function(){var t=localStorage.getItem('pa-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');else if(t==='pink')document.documentElement.setAttribute('data-theme','pink');})()</script>
  <style>
    /* ── PAGE HEADER ── */
    .page-header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 3.5rem 2rem 1.5rem;
    }
    .page-header h1 {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--c-text);
      margin-bottom: 0.3rem;
    }
    .page-header p {
      color: var(--c-text2);
      font-size: 0.95rem;
    }

    /* ── TOOLBAR ── */
    .toolbar {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 180px;
    }
    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--c-text3);
      pointer-events: none;
      font-size: 0.85rem;
      line-height: 1;
    }
    .search-input {
      width: 100%;
      padding: 0.62rem 0.85rem 0.62rem 2.2rem;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 9px;
      color: var(--c-text);
      font-size: 0.875rem;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--c-accent);
      box-shadow: 0 0 0 3px var(--c-accent-bg);
    }
    .search-input::placeholder { color: var(--input-placeholder); }

    .filter-chip {
      padding: 0.42rem 0.85rem;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid var(--c-border);
      background: var(--c-surface);
      color: var(--c-text2);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-chip:hover,
    .filter-chip.active {
      background: var(--c-accent-bg);
      border-color: rgba(139,92,246,0.3);
      color: var(--c-accent2);
    }
    [data-theme="light"] .filter-chip:hover,
    [data-theme="light"] .filter-chip.active {
      border-color: rgba(99,102,241,0.25);
    }
    [data-theme="pink"] .filter-chip:hover,
    [data-theme="pink"] .filter-chip.active {
      border-color: rgba(233,30,140,0.28);
    }

    /* ── ISSUE ACCORDION ── */
    .issue-tab {
      margin-bottom: 0.85rem;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .issue-tab-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.25rem;
      background: var(--card-bg);
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
      border: none;
      width: 100%;
      font-family: inherit;
      text-align: left;
    }
    .issue-tab-header:hover { background: var(--card-hover-bg); }
    .issue-tab-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--c-text);
      letter-spacing: -0.02em;
    }
    .issue-tab-arrow {
      font-size: 0.75rem;
      color: var(--c-text3);
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .issue-tab-arrow.open { transform: rotate(90deg); }
    .issue-tab-body {
      padding: 0.75rem 1.25rem 1.25rem;
      background: var(--c-bg);
      border-top: 1px solid var(--card-border);
    }

    /* ── GUIDES CONTENT ── */
    .guides-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.75rem 2rem 2rem;
    }

    /* ── SUBJECT GROUP ── */
    .subject-group { margin-bottom: 2.75rem; }
    .subject-heading {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--c-text);
      padding-bottom: 0.65rem;
      margin-bottom: 0.85rem;
      border-bottom: 1px solid var(--c-border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .subject-heading::before {
      content: '';
      width: 3px;
      height: 1em;
      background: var(--c-accent);
      border-radius: 99px;
      flex-shrink: 0;
    }

    /* ── LEVEL GROUP ── */
    .level-group { margin-bottom: 1rem; }
    .level-label {
      font-size: 0.67rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--c-text3);
      margin-bottom: 0.45rem;
      padding: 0 0.2rem;
    }

    /* ── GUIDE CARD ── */
    .guide-card {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.8rem 1rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      margin-bottom: 0.35rem;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    .guide-card:hover {
      background: var(--card-hover-bg);
      border-color: var(--card-hover-border);
      transform: translateX(3px);
    }
    .guide-info { flex: 1; min-width: 0; }
    .guide-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--c-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }
    .guide-meta {
      font-size: 0.73rem;
      color: var(--c-text3);
      margin-top: 0.12rem;
    }
    .guide-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
    }
    .pdf-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.28rem;
      padding: 0.3rem 0.75rem;
      border-radius: 7px;
      background: var(--c-accent-bg);
      color: var(--c-accent2);
      font-size: 0.73rem;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid rgba(139,92,246,0.16);
      transition: all 0.15s;
      white-space: nowrap;
    }
    .pdf-btn:hover {
      background: var(--c-accent);
      color: #fff;
      border-color: var(--c-accent);
    }
    .remove-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.28rem;
      padding: 0.3rem 0.75rem;
      border-radius: 7px;
      background: var(--c-red-bg);
      color: var(--c-red);
      font-size: 0.73rem;
      font-weight: 600;
      border: 1px solid rgba(239,68,68,0.2);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .remove-btn:hover {
      background: #ef4444;
      color: #fff;
      border-color: #ef4444;
    }

    /* ── STATES ── */
    .state-msg {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--c-text2);
      font-size: 0.95rem;
    }
    .state-msg-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--c-text);
      margin-bottom: 0.35rem;
    }
    .error-banner {
      background: var(--c-red-bg);
      border: 1px solid rgba(239,68,68,0.2);
      color: var(--c-red);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }

    /* ── SKELETON ── */
    .skel-group { margin-bottom: 2.5rem; }
    .skel-heading {
      height: 20px; width: 140px;
      background: var(--c-surface2);
      border-radius: 5px;
      margin-bottom: 1rem;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .skel-card {
      height: 54px;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: 10px;
      margin-bottom: 0.35rem;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 0.5; }
      50%      { opacity: 1; }
    }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      animation: fadeIn 0.18s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: var(--modal-bg);
      border: 1px solid var(--c-border2);
      border-radius: 20px;
      padding: 2rem;
      width: min(440px, 100%);
      box-shadow: var(--modal-shadow);
      animation: slideUp 0.24s cubic-bezier(0.34,1.56,0.64,1);
      position: relative;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      width: 30px; height: 30px;
      border-radius: 7px;
      border: 1px solid var(--c-border);
      background: var(--c-surface);
      color: var(--c-text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.15s;
      line-height: 1;
    }
    .modal-close:hover {
      background: var(--c-surface2);
      color: var(--c-text);
    }
    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--c-text);
      margin-bottom: 1.5rem;
    }
    .form-field { margin-bottom: 0.9rem; }
    .form-error {
      color: var(--c-red);
      background: var(--c-red-bg);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 8px;
      padding: 0.55rem 0.8rem;
      font-size: 0.82rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 540px) {
      .guide-card { flex-wrap: wrap; }
      .guide-title { white-space: normal; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .page-header { padding: 2.5rem 1.25rem 1rem; }
      .toolbar { padding: 0.75rem 1.25rem; }
      .guides-content { padding: 0.5rem 1.25rem 2rem; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;
    const { createRoot } = ReactDOM;

    /* ── Helpers ── */
    function escHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function parseJwt(token) {
      try {
        const b64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
        return JSON.parse(atob(b64));
      } catch { return null; }
    }
    function isTokenValid(token) {
      if (!token) return false;
      const p = parseJwt(token);
      return p && p.exp && p.exp * 1000 > Date.now();
    }
    function badgeClass(level) {
      const m = { beginner:'badge-beginner', intermediate:'badge-intermediate', advanced:'badge-advanced' };
      return m[(level||'').toLowerCase()] || 'badge-default';
    }

    /* ── Theme hook ── */
    function useTheme() {
      const [theme, setTheme] = useState(() => {
        const t = localStorage.getItem('pa-theme');
        return t === 'light' ? 'light' : t === 'pink' ? 'pink' : 'dark';
      });
      const toggle = useCallback(() => {
        const next = theme === 'dark' ? 'light' : theme === 'light' ? 'pink' : 'dark';
        setTheme(next);
        if (next === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else if (next === 'pink') document.documentElement.setAttribute('data-theme', 'pink');
        else document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('pa-theme', next);
      }, [theme]);
      return { theme, toggle };
    }

    /* ── Auth hook ── */
    function useAuth() {
      const [token, setToken] = useState(() => localStorage.getItem('jwt'));
      const authed = isTokenValid(token);
      const login = useCallback(tok => {
        localStorage.setItem('jwt', tok);
        setToken(tok);
      }, []);
      return { token, authed, login };
    }

    /* ── Nav ── */
    function Nav({ authed, theme, onToggle, onLoginClick }) {
      return (
        <nav>
          <a href="/index.html" className="nav-logo">
            <img src="/icon.png" alt="PA" className="nav-icon-img" />
            <span className="nav-brand">SHSID Peer Advisors</span>
          </a>
          <div className="nav-spacer" />
          <div className="nav-actions">
            <a href="/index.html" className="nav-link">Home</a>
            {authed ? (
              <a href="/upload.html" className="btn btn-primary" style={{marginRight:'0.2rem'}}>
                Upload Guide
              </a>
            ) : (
              <button className="btn btn-ghost" onClick={onLoginClick}>
                Login
              </button>
            )}
            <button className="theme-btn" onClick={onToggle} aria-label="Toggle theme">
              {theme === 'dark' ? '☀' : theme === 'light' ? '🌸' : '🌙'}
            </button>
          </div>
        </nav>
      );
    }

    /* ── Login Modal ── */
    function LoginModal({ onClose, onSuccess }) {
      const [email, setEmail]     = useState('');
      const [password, setPassword] = useState('');
      const [error, setError]     = useState('');
      const [loading, setLoading] = useState(false);

      const submit = async () => {
        setError('');
        if (!email || !password) { setError('Account and password are required.'); return; }
        setLoading(true);
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });
          const data = await res.json();
          if (!res.ok) { setError(data.error || 'Login failed.'); return; }
          onSuccess(data.token);
          onClose();
        } catch {
          setError('Network error. Please try again.');
        } finally {
          setLoading(false);
        }
      };

      const onKey = e => { if (e.key === 'Enter') submit(); };

      return (
        <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <button className="modal-close" onClick={onClose} aria-label="Close">×</button>
            <h2 className="modal-title" id="modal-title">Admin Login</h2>
            {error && <div className="form-error">{error}</div>}
            <div className="form-field">
              <label className="form-label" htmlFor="login-email">Account</label>
              <input
                id="login-email"
                className="form-input"
                type="text"
                autoComplete="username"
                placeholder="ask austin for account name"
                value={email}
                onChange={e => setEmail(e.target.value)}
                onKeyDown={onKey}
              />
            </div>
            <div className="form-field" style={{marginBottom:'1.25rem'}}>
              <label className="form-label" htmlFor="login-password">Password</label>
              <input
                id="login-password"
                className="form-input"
                type="password"
                autoComplete="current-password"
                placeholder="Password"
                value={password}
                onChange={e => setPassword(e.target.value)}
                onKeyDown={onKey}
              />
            </div>
            <button className="full-btn" onClick={submit} disabled={loading}>
              {loading ? 'Signing in…' : 'Sign In'}
            </button>
          </div>
        </div>
      );
    }

    /* ── Skeleton loader ── */
    function SkeletonLoader() {
      return (
        <div className="guides-content">
          {[1,2].map(i => (
            <div key={i} className="skel-group">
              <div className="skel-heading" />
              {[1,2,3].map(j => <div key={j} className="skel-card" />)}
            </div>
          ))}
        </div>
      );
    }

    /* ── Guide Card ── */
    function GuideCard({ guide, authed, token, onRemove }) {
      const [confirming, setConfirming] = useState(false);
      const [removing,   setRemoving]   = useState(false);

      const handleRemove = async () => {
        setRemoving(true);
        try {
          const res = await fetch(`/api/guides/${guide.id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` },
          });
          if (res.ok) {
            onRemove(guide.id);
          } else {
            const data = await res.json().catch(() => ({}));
            alert(data.error || 'Failed to remove guide.');
          }
        } catch {
          alert('Network error. Please try again.');
        } finally {
          setRemoving(false);
          setConfirming(false);
        }
      };

      return (
        <div className="guide-card">
          <div className="guide-info">
            <div className="guide-title">{guide.title}</div>
          </div>
          <div className="guide-actions">
            {authed && !confirming && (
              <button className="remove-btn" onClick={() => setConfirming(true)}>
                Remove
              </button>
            )}
            {authed && confirming && (
              <>
                <button className="remove-btn" onClick={handleRemove} disabled={removing}>
                  {removing ? 'Removing…' : 'Confirm'}
                </button>
                <button className="remove-btn" onClick={() => setConfirming(false)} disabled={removing}
                  style={{background:'var(--c-surface)', color:'var(--c-text2)', borderColor:'var(--c-border)'}}>
                  Cancel
                </button>
              </>
            )}
            <a className="pdf-btn" href={guide.pdf_url} target="_blank" rel="noopener noreferrer">
              View PDF ↗
            </a>
          </div>
        </div>
      );
    }

    /* ── Issue Tab (accordion item) ── */
    function IssueTab({ issueNumber, guides, subjects, search, authed, token, onRemove }) {
      const [open, setOpen] = useState(false);

      const filteredGuides = useMemo(() => {
        if (!search.trim()) return guides;
        const q = search.trim().toLowerCase();
        return guides.filter(g =>
          g.title.toLowerCase().includes(q) ||
          g.subject.toLowerCase().includes(q) ||
          g.subject_level.toLowerCase().includes(q)
        );
      }, [guides, search]);

      // Index filtered guides by subject+level for quick lookup
      const bySubjectLevel = useMemo(() => {
        const idx = {};
        for (const g of filteredGuides) {
          if (!idx[g.subject]) idx[g.subject] = {};
          if (!idx[g.subject][g.subject_level]) idx[g.subject][g.subject_level] = [];
          idx[g.subject][g.subject_level].push(g);
        }
        return idx;
      }, [filteredGuides]);

      return (
        <div className="issue-tab">
          <button
            className="issue-tab-header"
            onClick={() => setOpen(o => !o)}
            aria-expanded={open}
          >
            <span className="issue-tab-title">Issue {issueNumber}</span>
            <span className={`issue-tab-arrow${open ? ' open' : ''}`}>▶</span>
          </button>
          {open && (
            <div className="issue-tab-body">
              {subjects.map(subj => {
                const subjectLevels = bySubjectLevel[subj.name] || {};
                return (
                  <div key={subj.name} className="subject-group">
                    <h3 className="subject-heading">{subj.name}</h3>
                    {subj.levels.map(level => {
                      const levelGuides = subjectLevels[level] || [];
                      return (
                        <div key={level} className="level-group">
                          <div className="level-label">{level}</div>
                          {levelGuides.length === 0 ? (
                            <div style={{
                              fontSize: '0.8rem',
                              color: 'var(--c-text3)',
                              padding: '0.3rem 0.5rem',
                              fontStyle: 'italic',
                            }}>No guide available</div>
                          ) : (
                            levelGuides.map(g => <GuideCard key={g.id} guide={g} authed={authed} token={token} onRemove={onRemove} />)
                          )}
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    /* ── Guide List ── */
    function GuidesList({ guides, subjects, search, authed, token, onRemove }) {
      // Group guides by issue number
      const byIssue = useMemo(() => {
        const idx = {};
        for (const g of guides) {
          if (!idx[g.issue_number]) idx[g.issue_number] = [];
          idx[g.issue_number].push(g);
        }
        return idx;
      }, [guides]);

      const sortedIssues = useMemo(() =>
        Object.keys(byIssue).map(Number).sort((a, b) => a - b),
        [byIssue]
      );

      if (sortedIssues.length === 0) {
        return (
          <div className="guides-content">
            <div className="state-msg">
              <div className="state-msg-title">No guides found</div>
              <div>Try adjusting your search.</div>
            </div>
          </div>
        );
      }

      return (
        <div className="guides-content">
          {sortedIssues.map(issue => (
            <IssueTab
              key={issue}
              issueNumber={issue}
              guides={byIssue[issue]}
              subjects={subjects}
              search={search}
              authed={authed}
              token={token}
              onRemove={onRemove}
            />
          ))}
        </div>
      );
    }

    /* ── Footer ── */
    function Footer() {
      return (
        <footer>
          <div>2026 SHSID PA</div>
          <div style={{marginTop:'0.25rem', fontSize:'0.8rem', opacity:0.7}}>Site by Gavania</div>
          <div style={{marginTop:'0.4rem', fontSize:'0.8rem', opacity:0.7}}>
            Guides are licensed under{' '}
            <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener noreferrer"
               style={{color:'inherit', textDecoration:'underline'}}>
              CC BY-NC 4.0
            </a>
            {' '}— you may share and adapt them for non-commercial purposes with attribution.
            The site code is licensed under the{' '}
            <a href="https://opensource.org/licenses/MIT" target="_blank" rel="noopener noreferrer"
               style={{color:'inherit', textDecoration:'underline'}}>
              MIT License
            </a>
            {' '}— permission is granted free of charge to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the software, subject to the MIT license terms.
          </div>
        </footer>
      );
    }

    /* ── App ── */
    function App() {
      const { theme, toggle } = useTheme();
      const { token, authed, login } = useAuth();

      const [guides,    setGuides]    = useState([]);
      const [subjects,  setSubjects]  = useState([]);
      const [loading,   setLoading]   = useState(true);
      const [error,     setError]     = useState('');
      const [showModal, setShowModal] = useState(false);
      const [search,    setSearch]    = useState('');

      useEffect(() => {
        (async () => {
          try {
            const [guidesRes, subjectsRes] = await Promise.all([
              fetch('/api/guides'),
              fetch('/subjects.json'),
            ]);
            if (!guidesRes.ok) throw new Error('Failed to load guides');
            const guidesData = await guidesRes.json();
            const subjectsData = subjectsRes.ok ? await subjectsRes.json() : { subjects: [] };
            setGuides(guidesData);
            setSubjects(subjectsData.subjects || []);
          } catch {
            setError('Failed to load guides. Please try again later.');
          } finally {
            setLoading(false);
          }
        })();
      }, []);

      const removeGuide = useCallback(id => {
        setGuides(prev => prev.filter(g => g.id !== id));
      }, []);

      // When search changes, filter guides (pass all to GuidesList which filters per issue)
      const filteredGuides = useMemo(() => {
        if (!search.trim()) return guides;
        const q = search.trim().toLowerCase();
        return guides.filter(g =>
          g.title.toLowerCase().includes(q) ||
          g.subject.toLowerCase().includes(q) ||
          g.subject_level.toLowerCase().includes(q)
        );
      }, [guides, search]);

      return (
        <>
          <Nav
            authed={authed}
            theme={theme}
            onToggle={toggle}
            onLoginClick={() => setShowModal(true)}
          />

          {showModal && !authed && (
            <LoginModal onClose={() => setShowModal(false)} onSuccess={login} />
          )}

          <div className="page-header">
            <h1>Academic Guides</h1>
            <p>Peer-written study guides, organized by issue, subject, and level.</p>
          </div>

          <div className="toolbar">
            <div className="search-wrap">
              <span className="search-icon">⌕</span>
              <input
                className="search-input"
                type="search"
                placeholder="Search guides or subjects…"
                value={search}
                onChange={e => setSearch(e.target.value)}
                aria-label="Search guides"
              />
            </div>
          </div>

          {loading && <SkeletonLoader />}
          {!loading && error && (
            <div className="guides-content">
              <div className="error-banner">{error}</div>
            </div>
          )}
          {!loading && !error && guides.length === 0 && (
            <div className="state-msg">
              <div className="state-msg-title">No guides yet</div>
              <div>Check back soon — new guides are added regularly.</div>
            </div>
          )}
          {!loading && !error && guides.length > 0 && (
            <GuidesList guides={filteredGuides} subjects={subjects} search={search} authed={authed} token={token} onRemove={removeGuide} />
          )}

          <Footer />
        </>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
