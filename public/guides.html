<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guides – SHSID Peer Advisors</title>
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="/styles.css" />
  <script>
    (function(){
      var t = localStorage.getItem('pa-theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme','light');
      else if (t === 'dark') document.documentElement.setAttribute('data-theme','dark');
    })();
  </script>
  <style>
    /* ── MAIN ── */
    main { max-width: 980px; margin: 2.5rem auto; padding: 0 1.5rem; }
    main h1 {
      font-size: 2.2rem;
      font-weight: 900;
      margin-bottom: 0.3rem;
      color: var(--text-primary);
      letter-spacing: -0.6px;
    }
    .subtitle { color: var(--text-secondary); margin-bottom: 2.5rem; font-size: 0.97rem; }

    /* ── SUBJECT GROUP ── */
    .subject-group { margin-bottom: 3.5rem; }
    .subject-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.4px;
      padding-bottom: 0.5rem;
      margin-bottom: 1.4rem;
      border-bottom: 2px solid transparent;
      border-image: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 60%, transparent 100%) 1;
    }

    /* ── LEVEL GROUP ── */
    .level-group { margin-bottom: 1.75rem; }
    .level-heading {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--level-color);
      margin-bottom: 0.7rem;
      opacity: 0.85;
    }

    /* ── GUIDE CARD ── */
    .guide-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 1rem 1.35rem;
      margin-bottom: 0.6rem;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--card-border);
      border-left: 3px solid var(--card-accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.22s ease;
    }
    .guide-card:hover {
      box-shadow: var(--card-shadow-hover);
      transform: translateY(-2px);
    }
    .guide-info { flex: 1; min-width: 0; }
    .guide-title {
      font-weight: 600;
      font-size: 0.97rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
      letter-spacing: -0.1px;
    }
    .guide-meta { font-size: 0.78rem; color: var(--text-secondary); margin-top: 0.18rem; }

    /* ── BADGES ── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.22rem 0.7rem;
      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-beginner    { background: var(--badge-bg-beginner);    color: var(--badge-text-beginner); }
    .badge-intermediate{ background: var(--badge-bg-intermediate); color: var(--badge-text-intermediate); }
    .badge-advanced    { background: var(--badge-bg-advanced);    color: var(--badge-text-advanced); }
    .badge-default     { background: rgba(128,128,128,0.15);      color: var(--text-secondary); }

    /* ── PDF LINK ── */
    .pdf-link {
      color: var(--pdf-link);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      padding: 0.28rem 0.72rem;
      border-radius: 50px;
      background: var(--pdf-link-bg);
      border: 1px solid transparent;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .pdf-link:hover {
      background: var(--pdf-link-hover-bg);
      transform: translateY(-1px);
    }

    /* ── LOADING / ERROR ── */
    #loading { text-align: center; color: var(--text-secondary); padding: 4rem; font-size: 0.95rem; }
    #error-msg { color: #e11d48; text-align: center; padding: 2rem; display: none; }

    /* ── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 300;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--modal-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 20px;
      padding: 2.2rem;
      width: min(420px, 93vw);
      box-shadow: var(--modal-shadow);
      border: 1px solid var(--modal-border);
      position: relative;
      animation: modalIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal h2 {
      margin-bottom: 1.5rem;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .modal label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
      color: var(--text-secondary);
    }
    .modal input {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1px solid var(--modal-input-border);
      border-radius: 10px;
      font-size: 0.95rem;
      margin-bottom: 1.1rem;
      background: var(--input-bg);
      color: var(--text-primary);
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .modal input:focus {
      outline: none;
      border-color: var(--modal-input-focus);
      box-shadow: var(--input-focus-shadow);
    }
    .modal-error {
      color: #e11d48;
      font-size: 0.84rem;
      margin-bottom: 0.9rem;
      display: none;
      padding: 0.5rem 0.75rem;
      background: rgba(225, 29, 72, 0.08);
      border-radius: 8px;
    }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1.1rem;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      background: rgba(128,128,128,0.1);
      border: none;
      color: var(--text-secondary);
      transition: all 0.2s ease;
      line-height: 1;
    }
    .modal-close:hover {
      background: rgba(128,128,128,0.2);
      color: var(--text-primary);
    }
    #login-submit {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, var(--btn-grad-from) 0%, var(--btn-grad-to) 100%);
      color: var(--btn-text);
      border: none;
      border-radius: 50px;
      font-size: 0.97rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--btn-shadow);
    }
    #login-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px var(--accent-glow);
      filter: brightness(1.06);
    }

    @media (max-width: 540px) {
      .guide-card { flex-wrap: wrap; gap: 0.6rem; }
      .guide-title { white-space: normal; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-left" href="index.html">
    <img class="nav-icon" src="/icon.png" alt="SHSID PA icon" />
    <span class="nav-brand">SHSID Peer Advisors</span>
  </a>
  <div class="nav-right">
    <a href="index.html">Home</a>
    <span id="upload-link-wrap" style="display:none">
      <a href="upload.html" class="btn btn-primary">Upload Guide</a>
    </span>
    <button id="login-btn" class="btn btn-outline">Login</button>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
      <span class="theme-dot"></span><span class="toggle-label">Pink</span>
    </button>
  </div>
</nav>

<!-- Login Modal -->
<div class="modal-overlay" id="login-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <button class="modal-close" id="modal-close-btn" aria-label="Close">&times;</button>
    <h2 id="modal-title">Admin Login</h2>
    <div class="modal-error" id="login-error"></div>
    <label for="login-email">Account Name</label>
    <input type="email" id="login-email" autocomplete="email" placeholder="your-account@example.com" />
    <label for="login-password">Password</label>
    <input type="password" id="login-password" autocomplete="current-password" placeholder="Password" />
    <button id="login-submit">Sign In</button>
  </div>
</div>

<main>
  <h1>Academic Guides</h1>
  <p class="subtitle">Browse peer-written study guides, organized by subject and level.</p>

  <div id="loading">Loading guides…</div>
  <div id="error-msg">Failed to load guides. Please try again later.</div>
  <div id="guides-container"></div>
</main>

<script>
  /* ---- JWT helpers ---- */
  function parseJwt(token) {
    try {
      const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(atob(base64));
    } catch { return null; }
  }

  function isTokenValid(token) {
    if (!token) return false;
    const payload = parseJwt(token);
    if (!payload || !payload.exp) return false;
    return payload.exp * 1000 > Date.now();
  }

  /* ---- Auth UI ---- */
  const token = localStorage.getItem('jwt');
  const loginBtn = document.getElementById('login-btn');
  const uploadWrap = document.getElementById('upload-link-wrap');

  if (isTokenValid(token)) {
    loginBtn.style.display = 'none';
    uploadWrap.style.display = '';
  }

  /* Modal */
  const modal = document.getElementById('login-modal');
  loginBtn.addEventListener('click', () => modal.classList.add('open'));
  document.getElementById('modal-close-btn').addEventListener('click', () => modal.classList.remove('open'));
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });

  document.getElementById('login-submit').addEventListener('click', async () => {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');
    errorEl.style.display = 'none';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) { errorEl.textContent = data.error || 'Login failed'; errorEl.style.display = ''; return; }
      localStorage.setItem('jwt', data.token);
      modal.classList.remove('open');
      loginBtn.style.display = 'none';
      uploadWrap.style.display = '';
    } catch {
      errorEl.textContent = 'Network error. Please try again.';
      errorEl.style.display = '';
    }
  });

  /* ---- Load Guides ---- */
  function badgeClass(level) {
    const map = { beginner: 'badge-beginner', intermediate: 'badge-intermediate', advanced: 'badge-advanced' };
    return map[level.toLowerCase()] || 'badge-default';
  }

  async function loadGuides() {
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error-msg');
    const container = document.getElementById('guides-container');

    try {
      const res = await fetch('/api/guides');
      if (!res.ok) throw new Error('Bad response');
      const guides = await res.json();
      loadingEl.style.display = 'none';

      if (guides.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:var(--text-secondary);padding:2rem;">No guides uploaded yet.</p>';
        return;
      }

      // Group by subject
      const bySubject = {};
      for (const g of guides) {
        (bySubject[g.subject] = bySubject[g.subject] || {})[g.subject_level] =
          (bySubject[g.subject][g.subject_level] || []).concat(g);
      }

      const levelOrder = ['Beginner', 'Intermediate', 'Advanced'];

      for (const subject of Object.keys(bySubject).sort()) {
        const levels = bySubject[subject];
        const groupEl = document.createElement('div');
        groupEl.className = 'subject-group';

        const titleEl = document.createElement('h2');
        titleEl.className = 'subject-title';
        titleEl.textContent = subject;
        groupEl.appendChild(titleEl);

        const sortedLevels = [...new Set([...levelOrder, ...Object.keys(levels)])].filter(l => levels[l]);
        for (const level of sortedLevels) {
          const levelEl = document.createElement('div');
          levelEl.className = 'level-group';

          const heading = document.createElement('div');
          heading.className = 'level-heading';
          heading.textContent = level;
          levelEl.appendChild(heading);

          for (const g of levels[level].sort((a, b) => a.issue_number - b.issue_number)) {
            const card = document.createElement('div');
            card.className = 'guide-card';
            card.innerHTML = `
              <div class="guide-info">
                <div class="guide-title">${escHtml(g.title)}</div>
                <div class="guide-meta">Issue #${g.issue_number}</div>
              </div>
              <span class="badge ${badgeClass(g.subject_level)}">${escHtml(g.subject_level)}</span>
              <a class="pdf-link" href="${g.pdf_url}" target="_blank" rel="noopener">View PDF ↗</a>
            `;
            levelEl.appendChild(card);
          }
          groupEl.appendChild(levelEl);
        }
        container.appendChild(groupEl);
      }
    } catch {
      loadingEl.style.display = 'none';
      errorEl.style.display = '';
    }
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadGuides();

  /* ── Theme toggle ── */
  const THEMES = ['pink', 'light', 'dark'];
  const LABELS = { pink: 'Pink', light: 'Light', dark: 'Dark' };
  const toggleBtn = document.getElementById('theme-toggle');

  function getTheme() {
    return document.documentElement.getAttribute('data-theme') || 'pink';
  }

  function applyTheme(t) {
    if (t === 'pink') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('pa-theme', t);
    syncToggle(t);
  }

  function syncToggle(t) {
    t = t || getTheme();
    toggleBtn.innerHTML = `<span class="theme-dot"></span><span class="toggle-label">${LABELS[t]}</span>`;
  }

  syncToggle();

  toggleBtn.addEventListener('click', () => {
    const next = THEMES[(THEMES.indexOf(getTheme()) + 1) % THEMES.length];
    applyTheme(next);
  });
</script>

<footer>
  &copy; 2024 SHSID Peer Advisors &middot; All rights reserved
</footer>

</body>
</html>
