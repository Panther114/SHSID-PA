<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHSID Peer Advisor</title>
  <meta name="description" content="Curated academic study guides written by SHSID students, for SHSID students." />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <!-- Prevent flash of wrong theme -->
  <script>(function(){var t=localStorage.getItem('pa-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');else if(t==='pink')document.documentElement.setAttribute('data-theme','pink');})()</script>
  <style>
    /* ── HERO ── */
    .hero {
      position: relative;
      min-height: calc(100vh - 68px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 2rem 8rem;
      overflow: hidden;
    }

    /* Dot grid — institutional geometry */
    .hero-grid-overlay {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, var(--c-border2) 1px, transparent 1px);
      background-size: 30px 30px;
      opacity: 0.3;
      pointer-events: none;
      z-index: 0;
    }
    [data-theme="light"] .hero-grid-overlay { opacity: 0.18; }
    [data-theme="pink"]  .hero-grid-overlay { opacity: 0.22; }

    .hero-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      will-change: transform;
    }
    .blob-1 {
      width: 700px; height: 700px;
      background: rgba(139,92,246,0.25);
      top: -200px; left: -180px;
      animation: drift1 24s ease-in-out infinite;
    }
    .blob-2 {
      width: 520px; height: 520px;
      background: rgba(59,130,246,0.18);
      bottom: -100px; right: -120px;
      animation: drift2 19s ease-in-out infinite;
    }
    .blob-3 {
      width: 400px; height: 400px;
      background: rgba(236,72,153,0.1);
      top: 50%; left: 55%;
      animation: drift3 15s ease-in-out infinite;
    }
    [data-theme="light"] .blob-1 { background: rgba(99,102,241,0.12); }
    [data-theme="light"] .blob-2 { background: rgba(37,99,235,0.08); }
    [data-theme="light"] .blob-3 { background: rgba(236,72,153,0.06); }
    [data-theme="pink"]  .blob-1 { background: rgba(240,98,146,0.2); }
    [data-theme="pink"]  .blob-2 { background: rgba(255,183,77,0.16); }
    [data-theme="pink"]  .blob-3 { background: rgba(252,228,236,0.28); }

    @keyframes drift1 {
      0%,100% { transform: translate(0,0) scale(1); }
      50%      { transform: translate(70px,55px) scale(1.12); }
    }
    @keyframes drift2 {
      0%,100% { transform: translate(0,0) scale(1); }
      50%      { transform: translate(-55px,-75px) scale(0.9); }
    }
    @keyframes drift3 {
      0%,100% { transform: translate(-50%,-50%) scale(1); }
      33%      { transform: translate(-38%,-62%) scale(1.1); }
      66%      { transform: translate(-62%,-38%) scale(0.88); }
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
    }

    /* MASSIVE institutional display title */
    .hero-title {
      font-size: clamp(4.5rem, 13vw, 9rem);
      font-weight: 900;
      line-height: 0.92;
      letter-spacing: -0.055em;
      color: var(--c-text);
      margin-bottom: 1rem;
    }
    .grad-text {
      background: linear-gradient(135deg, #c4b5fd 0%, #a78bfa 40%, #818cf8 70%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    [data-theme="light"] .grad-text {
      background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 60%, #4338ca 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    [data-theme="pink"] .grad-text {
      background: linear-gradient(135deg, #e91e8c 0%, #f06292 50%, #f48fb1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Geometric accent bar — signature institutional element */
    .hero-accent-bar {
      width: 64px;
      height: 4px;
      background: var(--c-accent);
      border-radius: 2px;
      margin: 1.25rem auto 1.25rem;
    }

    /* Uppercase institutional tagline */
    .hero-tagline {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--c-accent2);
      margin-bottom: 1.5rem;
    }

    .hero-subtitle {
      font-size: clamp(0.92rem, 2vw, 1.075rem);
      color: var(--c-text2);
      max-width: 460px;
      margin: 0 auto 2.75rem;
      line-height: 1.78;
      font-weight: 400;
    }
    .hero-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ── CTA SECTION ── */
    .cta-section {
      text-align: center;
      padding: 7rem 2rem 9rem;
      position: relative;
      overflow: hidden;
    }
    .cta-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 55% at 50% 50%, var(--c-accent-bg) 0%, transparent 70%);
      pointer-events: none;
    }
    .cta-content { position: relative; z-index: 1; }
    .cta-kicker {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--c-accent2);
      margin-bottom: 0.65rem;
    }
    .cta-title {
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 900;
      letter-spacing: -0.055em;
      color: var(--c-text);
      margin-bottom: 0.8rem;
      line-height: 0.98;
    }
    .cta-sub {
      font-size: 1rem;
      color: var(--c-text2);
      max-width: 400px;
      margin: 0 auto 2.5rem;
      line-height: 1.7;
    }

    @media (max-width: 540px) {
      .hero { padding: 4rem 1.25rem 6rem; }
      .blob-1 { width: 300px; height: 300px; }
      .blob-2 { width: 260px; height: 260px; }
      .blob-3 { width: 200px; height: 200px; }
      .hero-title { letter-spacing: -0.04em; }
      .cta-section { padding-left: 1.25rem; padding-right: 1.25rem; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useCallback } = React;
    const { createRoot } = ReactDOM;

    /* ── Theme hook ── */
    function useTheme() {
      const [theme, setTheme] = useState(() => {
        const t = localStorage.getItem('pa-theme');
        return t === 'light' ? 'light' : t === 'pink' ? 'pink' : 'dark';
      });
      const toggle = useCallback(() => {
        const next = theme === 'dark' ? 'light' : theme === 'light' ? 'pink' : 'dark';
        setTheme(next);
        if (next === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else if (next === 'pink') document.documentElement.setAttribute('data-theme', 'pink');
        else document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('pa-theme', next);
      }, [theme]);
      return { theme, toggle };
    }

    /* ── Nav ── */
    function Nav({ theme, onToggle }) {
      return (
        <nav>
          <a href="/index.html" className="nav-logo">
            <img src="/logo.png" alt="PA" className="nav-icon-img" />
            <span className="nav-brand">SHSID Peer Advisors</span>
          </a>
          <div className="nav-spacer" />
          <div className="nav-actions">
            <a href="/guides.html" className="nav-link">Guides</a>
            <button className="theme-btn" onClick={onToggle} aria-label="Toggle theme" title="Toggle theme">
              {theme === 'dark' ? '☀' : theme === 'light' ? '🌸' : '🌙'}
            </button>
          </div>
        </nav>
      );
    }

    /* ── Hero ── */
    function Hero() {
      return (
        <section className="hero">
          <div className="hero-blob blob-1" aria-hidden="true" />
          <div className="hero-blob blob-2" aria-hidden="true" />
          <div className="hero-blob blob-3" aria-hidden="true" />
          <div className="hero-grid-overlay" aria-hidden="true" />
          <div className="hero-content">
            <h1 className="hero-title">
              <span className="grad-text">SHSID</span><br />Peer Advisor
            </h1>
            <div className="hero-accent-bar" aria-hidden="true" />
            <p className="hero-tagline">Official SHSID G10 PA Site</p>
            <p className="hero-subtitle">
              Curated academic study guides — written by students, for students.
            </p>
            <div className="hero-actions">
              <a href="/guides.html" className="btn btn-primary btn-lg">
                Browse Guides →
              </a>
            </div>
          </div>
        </section>
      );
    }

    /* ── CTA ── */
    function CtaSection() {
      return (
        <section className="cta-section">
          <div className="cta-content">
            <p className="cta-kicker">Ready to learn?</p>
            <h2 className="cta-title">Find your next guide</h2>
            <p className="cta-sub">
              Browse the full library of peer-written academic guides across all subjects and levels.
            </p>
            <a href="/guides.html" className="btn btn-primary btn-lg">
              Browse All Guides →
            </a>
          </div>
        </section>
      );
    }

    /* ── Footer ── */
    function Footer() {
      return (
        <footer>
          <div>2026 SHSID PA</div>
          <div style={{marginTop:'0.25rem', fontSize:'0.8rem', opacity:0.7}}>Site by Gavania</div>
          <div style={{marginTop:'0.4rem', fontSize:'0.8rem', opacity:0.7}}>
            Guides are licensed under{' '}
            <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener noreferrer"
               style={{color:'inherit', textDecoration:'underline'}}>
              CC BY-NC 4.0
            </a>
            {' '}— you may share and adapt them for non-commercial purposes with attribution.
            The site code is licensed under the{' '}
            <a href="https://opensource.org/licenses/MIT" target="_blank" rel="noopener noreferrer"
               style={{color:'inherit', textDecoration:'underline'}}>
              MIT License
            </a>
            {' '}— permission is granted free of charge to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the software, subject to the MIT license terms.
          </div>
        </footer>
      );
    }

    /* ── App ── */
    function App() {
      const { theme, toggle } = useTheme();
      return (
        <>
          <Nav theme={theme} onToggle={toggle} />
          <Hero />
          <CtaSection />
          <Footer />
        </>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
