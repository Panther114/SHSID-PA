<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PA</title>
  <meta name="description" content="Curated academic study guides written by SHSID students, for SHSID students." />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <!-- Prevent flash of wrong theme -->
  <script>(function(){var t=localStorage.getItem('pa-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');else if(t==='pink')document.documentElement.setAttribute('data-theme','pink');})()</script>
  <style>
    /* ── HERO ── */
    .hero {
      position: relative;
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 2rem 8rem;
      overflow: hidden;
    }
    .hero-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(110px);
      pointer-events: none;
      will-change: transform;
    }
    .blob-1 {
      width: 650px; height: 650px;
      background: rgba(139,92,246,0.28);
      top: -180px; left: -160px;
      animation: drift1 24s ease-in-out infinite;
    }
    .blob-2 {
      width: 500px; height: 500px;
      background: rgba(59,130,246,0.2);
      bottom: -80px; right: -100px;
      animation: drift2 19s ease-in-out infinite;
    }
    .blob-3 {
      width: 380px; height: 380px;
      background: rgba(236,72,153,0.12);
      top: 50%; left: 55%;
      animation: drift3 15s ease-in-out infinite;
    }
    [data-theme="light"] .blob-1 { background: rgba(99,102,241,0.14); }
    [data-theme="light"] .blob-2 { background: rgba(37,99,235,0.1); }
    [data-theme="light"] .blob-3 { background: rgba(236,72,153,0.07); }
    [data-theme="pink"] .blob-1 { background: rgba(240,98,146,0.22); }
    [data-theme="pink"] .blob-2 { background: rgba(255,183,77,0.18); }
    [data-theme="pink"] .blob-3 { background: rgba(252,228,236,0.3); }

    @keyframes drift1 {
      0%,100% { transform: translate(0,0) scale(1); }
      50%      { transform: translate(70px,55px) scale(1.12); }
    }
    @keyframes drift2 {
      0%,100% { transform: translate(0,0) scale(1); }
      50%      { transform: translate(-55px,-75px) scale(0.9); }
    }
    @keyframes drift3 {
      0%,100% { transform: translate(-50%,-50%) scale(1); }
      33%      { transform: translate(-38%,-62%) scale(1.1); }
      66%      { transform: translate(-62%,-38%) scale(0.88); }
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 700px;
      margin: 0 auto;
    }
    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.28rem 0.9rem;
      border-radius: 99px;
      background: var(--c-accent-bg);
      border: 1px solid rgba(139,92,246,0.22);
      color: var(--c-accent2);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.75rem;
    }
    [data-theme="light"] .hero-eyebrow { border-color: rgba(99,102,241,0.2); }
    [data-theme="pink"] .hero-eyebrow { border-color: rgba(233,30,140,0.22); }

    .hero-eyebrow-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--c-accent2);
      flex-shrink: 0;
    }
    .hero-title {
      font-size: clamp(2.8rem, 7vw, 5rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.04em;
      color: var(--c-text);
      margin-bottom: 1.25rem;
    }
    .grad-text {
      background: linear-gradient(135deg, #c4b5fd 0%, #a78bfa 40%, #818cf8 70%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    [data-theme="light"] .grad-text {
      background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 60%, #4338ca 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    [data-theme="pink"] .grad-text {
      background: linear-gradient(135deg, #e91e8c 0%, #f06292 50%, #f48fb1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-subtitle {
      font-size: clamp(1rem, 2vw, 1.125rem);
      color: var(--c-text2);
      max-width: 520px;
      margin: 0 auto 2.5rem;
      line-height: 1.75;
      font-weight: 400;
    }
    .hero-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ── FEATURES ── */
    .features {
      max-width: 1100px;
      margin: 0 auto;
      padding: 6rem 2rem;
    }
    .section-eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--c-accent2);
      margin-bottom: 0.65rem;
    }
    .section-title {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      color: var(--c-text);
      margin-bottom: 0.75rem;
      line-height: 1.1;
    }
    .section-desc {
      font-size: 1rem;
      color: var(--c-text2);
      max-width: 480px;
      line-height: 1.75;
      margin-bottom: 3rem;
    }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }
    .feature-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.75rem;
      transition: background 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .feature-card:hover {
      background: var(--card-hover-bg);
      border-color: var(--card-hover-border);
      transform: translateY(-4px);
      box-shadow: 0 16px 48px rgba(0,0,0,0.18);
    }
    .feature-icon-wrap {
      width: 44px; height: 44px;
      border-radius: 11px;
      background: var(--c-accent-bg);
      border: 1px solid rgba(139,92,246,0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      margin-bottom: 1.1rem;
    }
    [data-theme="light"] .feature-icon-wrap { border-color: rgba(99,102,241,0.14); }
    [data-theme="pink"] .feature-icon-wrap { border-color: rgba(233,30,140,0.18); }
    .feature-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--c-text);
      letter-spacing: -0.02em;
      margin-bottom: 0.45rem;
    }
    .feature-desc {
      font-size: 0.875rem;
      color: var(--c-text2);
      line-height: 1.7;
    }

    /* ── DIVIDER ── */
    .section-divider {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem;
      border: none;
      border-top: 1px solid var(--c-border);
    }

    /* ── CTA SECTION ── */
    .cta-section {
      text-align: center;
      padding: 7rem 2rem 9rem;
      position: relative;
      overflow: hidden;
    }
    .cta-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 55% at 50% 50%, var(--c-accent-bg) 0%, transparent 70%);
      pointer-events: none;
    }
    .cta-content { position: relative; z-index: 1; }
    .cta-kicker {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--c-accent2);
      margin-bottom: 0.65rem;
    }
    .cta-title {
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--c-text);
      margin-bottom: 0.8rem;
      line-height: 1.1;
    }
    .cta-sub {
      font-size: 1.025rem;
      color: var(--c-text2);
      max-width: 440px;
      margin: 0 auto 2.25rem;
      line-height: 1.7;
    }

    @media (max-width: 540px) {
      .hero { padding: 4rem 1.25rem 6rem; }
      .blob-1 { width: 300px; height: 300px; }
      .blob-2 { width: 260px; height: 260px; }
      .blob-3 { width: 200px; height: 200px; }
      .features, .cta-section { padding-left: 1.25rem; padding-right: 1.25rem; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useCallback } = React;
    const { createRoot } = ReactDOM;

    /* ── Theme hook ── */
    function useTheme() {
      const [theme, setTheme] = useState(() => {
        const t = localStorage.getItem('pa-theme');
        return t === 'light' ? 'light' : t === 'pink' ? 'pink' : 'dark';
      });
      const toggle = useCallback(() => {
        const next = theme === 'dark' ? 'light' : theme === 'light' ? 'pink' : 'dark';
        setTheme(next);
        if (next === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else if (next === 'pink') document.documentElement.setAttribute('data-theme', 'pink');
        else document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('pa-theme', next);
      }, [theme]);
      return { theme, toggle };
    }

    /* ── Nav ── */
    function Nav({ theme, onToggle }) {
      return (
        <nav>
          <a href="/index.html" className="nav-logo">
            <img src="/icon.png" alt="PA" className="nav-icon-img" />
            <span className="nav-brand">SHSID Peer Advisors</span>
          </a>
          <div className="nav-spacer" />
          <div className="nav-actions">
            <a href="/guides.html" className="nav-link">Guides</a>
            <a href="#about" className="nav-link">About Us</a>
            <button className="theme-btn" onClick={onToggle} aria-label="Toggle theme" title="Toggle theme">
              {theme === 'dark' ? '☀' : theme === 'light' ? '🌸' : '🌙'}
            </button>
          </div>
        </nav>
      );
    }

    /* ── Hero ── */
    function Hero() {
      return (
        <section className="hero">
          <div className="hero-blob blob-1" aria-hidden="true" />
          <div className="hero-blob blob-2" aria-hidden="true" />
          <div className="hero-blob blob-3" aria-hidden="true" />
          <div className="hero-content">
            <div className="hero-eyebrow">
              <span className="hero-eyebrow-dot" />
              Official SHSID PA G10 Website
            </div>
            <h1 className="hero-title">
              Academic Guides<br />
              <span className="grad-text">by Your Peers</span>
            </h1>
            <p className="hero-subtitle">
              U U U U U U U U U U U U GAY GAY GAY GAY GAY GAY GAY GAY GAY
            </p>
            <div className="hero-actions">
              <a href="/guides.html" className="btn btn-primary btn-lg">
                Browse Guides →
              </a>
              <a href="#about" className="btn btn-ghost btn-lg">
                About Us
              </a>
            </div>
          </div>
        </section>
      );
    }

    /* ── Features ── */
    const FEATURES = [
      {
        icon: '✍️',
        name: 'Student-Written',
        desc: 'Every guide is authored by a fellow SHSID student who has excelled in that subject — written from first-hand experience.',
      },
      {
        icon: '◈',
        name: 'Multi-Level',
        desc: 'Guides are tagged Beginner, Intermediate, or Advanced so you can find content that matches exactly where you are.',
      },
      {
        icon: '◎',
        name: 'Always Free',
        desc: 'All materials are freely available to every SHSID student — no account required, no paywalls, ever.',
      },
    ];

    function Features() {
      return (
        <section className="features" id="about">
          <p className="section-eyebrow">About SHSID PA</p>
          <h2 className="section-title">Quality Study Guides.</h2>
          <p className="section-desc">
            Me Me U U Me Me U u
          </p>
          <div className="features-grid">
            {FEATURES.map(f => (
              <div key={f.name} className="feature-card">
                <div className="feature-icon-wrap">{f.icon}</div>
                <h3 className="feature-name">{f.name}</h3>
                <p className="feature-desc">{f.desc}</p>
              </div>
            ))}
          </div>
        </section>
      );
    }

    /* ── CTA ── */
    function CtaSection() {
      return (
        <section className="cta-section">
          <div className="cta-content">
            <p className="cta-kicker">Ready to learn?</p>
            <h2 className="cta-title">Find your next guide</h2>
            <p className="cta-sub">
              Browse the full library of peer-written academic guides across all subjects and levels.
            </p>
            <a href="/guides.html" className="btn btn-primary btn-lg">
              Browse All Guides →
            </a>
          </div>
        </section>
      );
    }

    /* ── Footer ── */
    function Footer() {
      return (
        <footer>
          <div>© 2026 JL SHSID PA</div>
          <div style={{marginTop:'0.4rem', fontSize:'0.8rem', opacity:0.7}}>
            Guides are licensed under{' '}
            <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener noreferrer"
               style={{color:'inherit', textDecoration:'underline'}}>
              CC BY-NC 4.0
            </a>
            {' '}— you may share and adapt them for non-commercial purposes with attribution.
            The site code is licensed under the{' '}
            <a href="https://opensource.org/licenses/MIT" target="_blank" rel="noopener noreferrer"
               style={{color:'inherit', textDecoration:'underline'}}>
              MIT License
            </a>
            {' '}— permission is granted free of charge to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the software, subject to the MIT license terms.
          </div>
        </footer>
      );
    }

    /* ── App ── */
    function App() {
      const { theme, toggle } = useTheme();
      return (
        <>
          <Nav theme={theme} onToggle={toggle} />
          <Hero />
          <hr className="section-divider" />
          <Features />
          <CtaSection />
          <Footer />
        </>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
